[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-ft"
version = "0.1.0"
description = "LoRA / QLoRA fine-tuning of Qwen3-1.7B for Text-to-SQL, with bitsandbytes 4-bit quantization and vLLM serving."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vicente" }]
keywords = ["llm", "fine-tuning", "lora", "qlora", "text-to-sql", "vllm", "qwen"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:google.*",
]
